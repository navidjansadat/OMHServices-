<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به پنل مدیریت</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="admin-login-page">

    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <i class="fas fa-bolt"></i>
                <span>OMH</span>
            </div>
            <h2>پنل مدیریت</h2>
            <p>لطفاً برای ورود اطلاعات خود را وارد کنید</p>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> نام کاربری</label>
                    <input type="text" id="username" placeholder="نام کاربری را وارد کنید" required />
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> رمز عبور</label>
                    <input type="password" id="password" placeholder="رمز عبور را وارد کنید" required />
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> ورود
                </button>

                <div id="loginError" class="login-error"></div>
            </form>

            <div class="login-footer">
                <a href="/">← بازگشت به سایت</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
