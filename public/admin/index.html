<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | OMH</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body class="admin-login-page"><div class="login-container"><div class="login-box"><div class="login-logo"><img id="loginLogo" class="site-logo-img" hidden alt="OMH"><i id="loginFallback" class="fas fa-bolt"></i><span>OMH</span></div><h2>پنل مدیریت</h2><p>برای ادامه وارد حساب مدیریت شوید.</p><form id="loginForm"><input type="text" id="username" value="OMH" autocomplete="username" hidden><div class="form-group"><label><i class="fas fa-lock"></i> رمز عبور</label><input type="password" id="password" autocomplete="current-password" required autofocus></div><button type="submit" id="loginBtn" class="btn-login"><i class="fas fa-sign-in-alt"></i> ورود</button><div id="loginError" class="login-error"></div></form><div class="login-footer"><a href="/">← بازگشت به سایت</a></div></div></div><script>
const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),err=document.getElementById('loginError');
form.addEventListener('submit',async e=>{e.preventDefault();err.classList.remove('show');btn.disabled=true;btn.textContent='در حال ورود...';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'ورود ناموفق');location.href='/admin/dashboard.html';}catch(x){err.textContent=x.message;err.classList.add('show');btn.disabled=false;btn.innerHTML='<i class="fas fa-sign-in-alt"></i> ورود';}});
</script></body></html>
